# Postgres de UMA cópia do Balcão. Não suba direto: use `npm run up`, que
# dá a cada cópia (clone ou worktree) o seu projeto do compose
# (`-p balcao-<cópia>`), o seu volume e a sua porta.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: balcao
    ports:
      # Porta do host escolhida pelo Docker: duas cópias nunca disputam a 5432.
      - "127.0.0.1::5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcao -d balcao"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
