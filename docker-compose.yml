# Postgres de UMA cópia do Balcão. Não suba direto: use `npm run up`, que
# dá a cada cópia (clone ou worktree) o seu projeto do compose
# (`-p balcao-<cópia>`), o seu volume e a sua porta.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: balcao
      POSTGRES_PASSWORD: balcao
      POSTGRES_DB: balcao
    ports:
      # Porta do host escolhida pelo Docker: duas cópias nunca disputam a 5432.
      - "127.0.0.1::5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Por TCP, não pelo socket. Num volume novo, o Postgres cria o banco num
      # servidor temporário que só escuta no socket e depois reinicia. Pelo
      # socket, o `--wait` liberava a subida antes da hora e as migrations
      # falhavam com P1001 (docs/incidentes.md, incidente 6).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U balcao -d balcao"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
